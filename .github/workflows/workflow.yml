name: CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: dejwk/roo_testing/.github/workflows/client-ci.yml@f2e3d44466fb8f6603611762ccf59dc2542a5a23 # roo_testing 2.6.0
    with:
      profiles: '["arduino_esp32"]'
