name: CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: dejwk/roo_testing/.github/workflows/client-ci.yml@e8d1ad9299d01eff945f417ac407df71d698bff5 # roo_testing 2.7.0
    with:
      profiles: '["arduino_esp32"]'
